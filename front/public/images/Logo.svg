<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100"
  height="100"
  viewBox="0 0 100 100"
>
  <!-- Circle around the B -->
  <circle cx="50" cy="50" r="45" stroke="#B76D68" stroke-width="3" fill="none" />

  <!-- Italicized Letter B -->
  <text
    x="50%"
    y="50%"
    dominant-baseline="middle"
    text-anchor="middle"
    font-size="50"
    font-family="'Poppins', sans-serif"
    font-weight="bold"
    font-style="italic"
    fill="#B76D68"
    style="filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.2));"
  >
    B
  </text>

  <!-- Dot -->
  <circle cx="70" cy="50" r="5" fill="white" />
</svg>
