    <linearGradient id="paint0_linear" x1="800" y1="200" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4A4A6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F4A4A6" stop-opacity="0"/>
    </linearGradient>
